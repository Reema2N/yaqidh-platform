{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Violence Detection System</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div id="login-page" class="page active">
    <div class="login-container">

        <div class="login-header">
            <div class="logo-circle">
                <i class="fas fa-shield-alt"></i>
            </div>

            <h1>Create New Password</h1>
            <p>Please set your password before accessing the system</p>
        </div>

        <div class="login-form-container">

            <h2>Change Password</h2>

            <form method="post">
                {% csrf_token %}

                {% if error %}
                <div class="error-message" style="color:#ff4d4f; margin-bottom:15px; text-align:center;">
                    {{ error }}
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary btn-full">
                    Save Password
                </button>

            </form>

        </div>

        <p class="login-footer">
            Secure Access Only • Authorized Personnel
        </p>

    </div>
</div>

</body>
</html>
